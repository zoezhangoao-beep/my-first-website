<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网站</title>
  <meta name="description" content="这是我创建的第一个网站。欢迎来访！">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; background: #f4f7fb; color: #243047; }
    main { max-width: 760px; margin: 80px auto; padding: 24px; }
    .card { background: white; padding: 48px 32px; border-radius: 20px; text-align: center; box-shadow: 0 10px 35px rgba(30,50,80,.08); }
    h1 { font-size: clamp(30px, 6vw, 46px); margin: 0 0 18px; }
    p { line-height: 1.8; color: #5c677b; }
    a { display: inline-block; margin-top: 18px; padding: 13px 22px; background: #2563eb; color: white; text-decoration: none; border-radius: 10px; }
    footer { margin-top: 28px; text-align: center; color: #788397; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>你好，世界！</h1>
      <p>欢迎来到我的第一个网站。</p>
      <p>这是我用 GitHub 创建并发布的网页。以后我会在这里分享我的想法和作品。</p>
      <a href="mailto:hello@example.com">联系我</a>
    </section>
    <footer>我的第一个网站 · 2026</footer>
  </main>
</body>
</html>
